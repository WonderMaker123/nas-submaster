name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '选择需要构建的目标架构 (x86_64, arm64, 或两者都构建)'
        required: true
        default: 'amd64'
        type: choice
        options:
          - 'amd64'
          - 'arm64'
          - 'all'
      tag_name:
        description: '自定义镜像标签 tag（留空则默认使用 latest 或对应架构名）'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine platform and tags
        id: prep
        run: |
          ARCH="${{ github.event.inputs.arch }}"
          CUSTOM_TAG="${{ github.event.inputs.tag_name }}"
          USER="${{ secrets.DOCKER_USERNAME }}"

          if [ "$ARCH" = "amd64" ]; then
            PLATFORMS="linux/amd64"
            if [ -n "$CUSTOM_TAG" ]; then
              TAGS="$USER/nas-submaster:$CUSTOM_TAG,$USER/nas-submaster:$CUSTOM_TAG-amd64"
            else
              TAGS="$USER/nas-submaster:latest,$USER/nas-submaster:amd64"
            fi
          elif [ "$ARCH" = "arm64" ]; then
            PLATFORMS="linux/arm64"
            if [ -n "$CUSTOM_TAG" ]; then
              TAGS="$USER/nas-submaster:$CUSTOM_TAG,$USER/nas-submaster:$CUSTOM_TAG-arm64"
            else
              TAGS="$USER/nas-submaster:arm64"
            fi
          else
            PLATFORMS="linux/amd64,linux/arm64"
            if [ -n "$CUSTOM_TAG" ]; then
              TAGS="$USER/nas-submaster:$CUSTOM_TAG"
            else
              TAGS="$USER/nas-submaster:latest"
            fi
          fi

          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.prep.outputs.platforms }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
