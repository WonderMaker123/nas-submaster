services:
  nas-subtitle:
    image: wndfl/nas-submaster:latest
    container_name: nas-submaster
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
      - /your/media/path:/media/movies  # 修改成你自己的媒体库地址
      - /var/run/docker.sock:/var/run/docker.sock  # 自更新功能需要
    # Intel 核显/硬件加速支持（群晖/绿联/极空间/自建 NAS 具备核显时取消下面注释）
    # devices:
    #   - /dev/dri:/dev/dri
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # 首次启动时额外预下载的 Whisper 模型（镜像已开箱内置 tiny 无需重复拉取；如需开机自动预载 base 可取消注释）
      # - WHISPER_PRELOAD_MODELS=base
      # Whisper 设备：auto = 优先 GPU，不可用时回退 CPU；也可填 cpu / cuda
      - WHISPER_DEVICE=auto
      # 访问安全密码（留空或注释则免密进入；设置后公网访问需输入该密码）
      # - WEB_PASSWORD=your_secure_password
      # 代理设置（中国大陆 NAS 下载 base/small/large 等 HuggingFace 模型或请求国外 LLM 时按需取消注释）
      # - HTTP_PROXY=http://192.168.1.100:7890
      # - HTTPS_PROXY=http://192.168.1.100:7890
      # - NO_PROXY=localhost,127.0.0.1,subtitle-network
    shm_size: 4gb
    networks:
      - subtitle-network

networks:
  subtitle-network:
    driver: bridge
